name: publish-snapshot

on:
  push:
    branches:
      - 'master'
    tags-ignore:
      - '**'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

permissions:
  contents: read

jobs:
  publish-snapshot:
    runs-on: macos-latest
    if: github.repository == 'square/wire'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.1.1'

      # A release commit lands on master with a release version, not a snapshot version. This job
      # must not publish that release, because the release job publishes it from the tag. Two
      # deployments with the same coordinates make the second one fail Central Portal validation.
      - name: Check the version is a snapshot
        id: check_version
        run: |
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ -z "$VERSION" ]; then
            echo "VERSION_NAME not found in gradle.properties." >&2
            exit 1
          fi
          case "$VERSION" in
            *-SNAPSHOT)
              echo "snapshot=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "snapshot=false" >> "$GITHUB_OUTPUT"
              echo "Version $VERSION is not a snapshot. This job publishes nothing."
              ;;
          esac

      # We set `SDKROOT` as a workaround for https://github.com/gradle/gradle/pull/29227
      - name: Upload Artifacts
        if: steps.check_version.outputs.snapshot == 'true'
        run: |
          SDKROOT=$(xcrun -sdk macosx --show-sdk-path) ./gradlew publish --stacktrace --warning-mode all --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SECRET_PASSPHRASE }}
