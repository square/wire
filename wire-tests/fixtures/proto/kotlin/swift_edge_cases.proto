syntax = "proto2";

package squareup.protos.kotlin.swift_modules;

import "option_redacted.proto";

message SwiftEdgeCases {
  enum Error {
    UNKNOWN = 0;
    INNER_BAD_VALUE = 1;
  }

  enum Type {
    INACTIVE = 0;
    ACTIVE = 1;
  }

  optional string return = 1;
  optional Error error = 2;
  optional Type type = 3;
}

message Screen {
  oneof screen {
    string screen_oneof_string = 1;
    int32 screen_oneof_int32 = 2;
    SubMessage screen_oneof_sub_message = 3;
    Self self = 4;
  }

  oneof view {
    string view_oneof_string = 5;
    string container = 6;
  }

  message Self {}

  message SubMessage {
    optional string string = 1;

    oneof screen {
      string submessage_screen_oneof_string = 2;
    }

    oneof submessage {
      string submessage_oneof_string = 3;
      NestedSubMessage submessage_oneof_nested_sub_message = 4;
    }

    message NestedSubMessage {
      optional string string = 1;
    }
  }
}

enum Error {
  UNKNOWN = 0;
  BAD_VALUE = 1;
}

message SwiftDefaults {
  optional string dollar = 1 [default = "a$b \"c\" \\d\n"];
  optional double double_inf = 2 [default = inf];
  optional double double_neg_inf = 3 [default = -inf];
  optional double double_nan = 4 [default = nan];
  optional float float_inf = 5 [default = inf];
  optional float float_neg_inf = 6 [default = -inf];
  optional float float_nan = 7 [default = nan];
  optional double double_trailing_dot = 8 [default = 1.];
  optional float float_leading_dot = 9 [default = .5];
  optional string optional_dollar = 10 [default = "$"];
}

enum SwiftDashedEnum {
  DASHED-ZERO = 0;
  DOTTED.ONE = 1;
}

message SwiftDashedNames {
  optional string dashed-field = 1;
  optional string dotted.field = 2;
  optional SwiftDashedEnum dashed-enum = 3 [default = DASHED-ZERO];
  optional string secret-field = 4 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  repeated string dashed-list = 5;
  map<string, string> dashed-map = 6;

  oneof dashed-oneof {
    string dashed-oneof-string = 7;
    int32 dotted.oneof.int = 8 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  }
}

message Dashed-Message {
  optional string value = 1;
}

message SwiftJsonNames {
  optional string dollar = 1 [json_name = "a$b"];
  optional string template = 2 [json_name = "${x}"];
  optional string percent = 3 [json_name = "100%"];
  optional string directive = 4 [json_name = "%s %S %1S"];
  required string required_name = 5 [json_name = "$required"];

  oneof choice {
    string oneof_dollar = 6 [json_name = "$one"];
    int32 oneof_percent = 7 [json_name = "%one"];
  }
}

enum SwiftReservedEnum {
  self = 0;
  init = 1;
  Type = 2;
  Protocol = 3;
  Any = 4;
  allCases = 5;
}

message SwiftReservedEnumNames {
  optional SwiftReservedEnum default_self = 1 [default = self];
  optional SwiftReservedEnum default_init = 2 [default = init];
  optional SwiftReservedEnum default_type = 3 [default = Type];
  optional SwiftReservedEnum default_protocol = 4 [default = Protocol];
  optional SwiftReservedEnum plain = 5;
  repeated SwiftReservedEnum list = 6;
}

message SwiftReservedTypeNames {
  enum Protocol {
    PROTOCOL_ZERO = 0;
    PROTOCOL_ONE = 1;
  }

  optional Protocol protocol = 1;
  optional Protocol default_protocol = 2 [default = PROTOCOL_ONE];
  repeated Protocol protocols = 3;
}

message SwiftOneofProtocol {
  oneof protocol {
    string a = 1;
    int32 b = 2;
  }
}

message SwiftOneofType {
  oneof type {
    string c = 1;
    int32 d = 2;
  }
}

// A constant with the name of its enum is fine in a default outside the enum.
enum SwiftSameNameEnum {
  SwiftSameNameEnum = 0;
  SWIFT_SAME_NAME_OTHER = 1;
}

message SwiftSameNameOuter {
  enum Inner {
    SwiftSameNameOuter = 0;
    SWIFT_SAME_NAME_INNER_OTHER = 1;
  }

  optional SwiftSameNameEnum top = 1 [default = SwiftSameNameEnum];
  optional Inner inner = 2 [default = SwiftSameNameOuter];
}

// A proto2 enum has no static `defaultedValue`, so the constant keeps its name.
enum SwiftProto2DefaultedValueName {
  defaultedValue = 0;
  SWIFT_PROTO2_OTHER = 1;
}

// A oneof named `self` or `Self` has an enum named `Self`, which hides `Self` in the message.
message SwiftOneofSelf {
  oneof self {
    string a = 1;
    int32 b = 2;
  }
}

message SwiftOneofSelfUpper {
  oneof Self {
    string a = 1;
    int32 b = 2;
  }
}

message SwiftOneofProtocolUpper {
  oneof Protocol {
    string a = 1;
    int32 b = 2;
  }
}

message SwiftOneofTypeUpper {
  oneof Type {
    string a = 1;
    int32 b = 2;
  }
}

message SwiftOneofAny {
  oneof any {
    string a = 1;
    int32 b = 2;
  }
}

// The enum named `Self` also hides `Self` in the nested types.
message SwiftSelfNested {
  message Inner {
    optional string a = 1;
  }

  message Self {
    optional string a = 1;
  }

  oneof self {
    Inner x = 1;
    string y = 2;
  }

  optional Self s = 3;
  optional Inner i = 4;
}

message SwiftFieldNames {
  optional string self = 1;
  optional string Self = 2;
  optional string Type = 3;
  optional string Protocol = 4;
  optional string Any = 5;
  repeated string init = 6;
}

message SwiftRequiredFieldNames {
  required string self = 1;
  required string Protocol = 2;
  required string Any = 3;
}

message SwiftOneofFieldNames {
  oneof choice {
    string self = 1;
    int32 Protocol = 2;
    bool Any = 3;
    string Type = 4;
    string Self = 5;
  }
}

message SwiftNestedAny {
  message Any {
    optional string a = 1;
  }

  optional Any value = 1;
}

message SwiftRedactedNames {
  optional string self = 1 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  optional string Protocol = 2 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  optional string plain = 3;

  oneof Any {
    string x = 4 [(squareup.protos.kotlin.redacted_option.redacted) = true];
    string y = 5;
  }
}

// A message with 16 fields keeps its fields in a heap-allocated storage.
message SwiftHeapNames {
  oneof self {
    string a = 1;
    int32 b = 2;
  }

  optional string Protocol = 3;
  required string Any = 4;
  optional string f5 = 5;
  optional string f6 = 6;
  optional string f7 = 7;
  optional string f8 = 8;
  optional string f9 = 9;
  optional string f10 = 10;
  optional string f11 = 11;
  optional string f12 = 12;
  optional string f13 = 13;
  optional string f14 = 14;
  optional string f15 = 15;
  optional string f16 = 16;
}

message SwiftHeapFieldNames {
  required string self = 1;
  optional string Protocol = 2;
  optional string f3 = 3;
  optional string f4 = 4;
  optional string f5 = 5;
  optional string f6 = 6;
  optional string f7 = 7;
  optional string f8 = 8;
  optional string f9 = 9;
  optional string f10 = 10;
  optional string f11 = 11;
  optional string f12 = 12;
  optional string f13 = 13;
  optional string f14 = 14;
  optional string f15 = 15;
  optional string f16 = 16;
}

message SwiftExtensibleNames {
  extensions 100 to 200;
}

extend SwiftExtensibleNames {
  optional string self = 101;
  optional string Protocol = 102;
  optional string Any = 103 [default = "d"];
}
