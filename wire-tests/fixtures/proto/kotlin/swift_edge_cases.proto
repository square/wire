syntax = "proto2";

package squareup.protos.kotlin.swift_modules;

import "option_redacted.proto";

message SwiftEdgeCases {
  enum Error {
    UNKNOWN = 0;
    INNER_BAD_VALUE = 1;
  }

  enum Type {
    INACTIVE = 0;
    ACTIVE = 1;
  }

  optional string return = 1;
  optional Error error = 2;
  optional Type type = 3;
}

message Screen {
  oneof screen {
    string screen_oneof_string = 1;
    int32 screen_oneof_int32 = 2;
    SubMessage screen_oneof_sub_message = 3;
    Self self = 4;
  }

  oneof view {
    string view_oneof_string = 5;
    string container = 6;
  }

  message Self {}

  message SubMessage {
    optional string string = 1;

    oneof screen {
      string submessage_screen_oneof_string = 2;
    }

    oneof submessage {
      string submessage_oneof_string = 3;
      NestedSubMessage submessage_oneof_nested_sub_message = 4;
    }

    message NestedSubMessage {
      optional string string = 1;
    }
  }
}

enum Error {
  UNKNOWN = 0;
  BAD_VALUE = 1;
}

message SwiftDefaults {
  optional string dollar = 1 [default = "a$b \"c\" \\d\n"];
  optional double double_inf = 2 [default = inf];
  optional double double_neg_inf = 3 [default = -inf];
  optional double double_nan = 4 [default = nan];
  optional float float_inf = 5 [default = inf];
  optional float float_neg_inf = 6 [default = -inf];
  optional float float_nan = 7 [default = nan];
  optional double double_trailing_dot = 8 [default = 1.];
  optional float float_leading_dot = 9 [default = .5];
  optional string optional_dollar = 10 [default = "$"];
}

enum SwiftDashedEnum {
  DASHED-ZERO = 0;
  DOTTED.ONE = 1;
}

message SwiftDashedNames {
  optional string dashed-field = 1;
  optional string dotted.field = 2;
  optional SwiftDashedEnum dashed-enum = 3 [default = DASHED-ZERO];
  optional string secret-field = 4 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  repeated string dashed-list = 5;
  map<string, string> dashed-map = 6;

  oneof dashed-oneof {
    string dashed-oneof-string = 7;
    int32 dotted.oneof.int = 8 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  }
}

message Dashed-Message {
  optional string value = 1;
}

message SwiftJsonNames {
  optional string dollar = 1 [json_name = "a$b"];
  optional string template = 2 [json_name = "${x}"];
  optional string percent = 3 [json_name = "100%"];
  optional string directive = 4 [json_name = "%s %S %1S"];
  required string required_name = 5 [json_name = "$required"];

  oneof choice {
    string oneof_dollar = 6 [json_name = "$one"];
    int32 oneof_percent = 7 [json_name = "%one"];
  }
}
