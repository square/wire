syntax = "proto2";

package squareup.protos.kotlin.sealed_redacted;

option java_package = "com.squareup.wire.protos.kotlin.sealedredacted";

import "option_redacted.proto";

message SealedRedactedOneOf {
  oneof variant {
    Payload payload = 1;
    string text = 2;
    State state = 3;
  }
  oneof sensitive {
    string secret = 4 [(squareup.protos.kotlin.redacted_option.redacted) = true];
    Payload wholly_redacted = 5 [(squareup.protos.kotlin.redacted_option.redacted) = true];
    string public_text = 6;
  }
}

message SealedRedactedOneOfBuildersOnly {
  oneof variant {
    Payload payload = 1;
    string text = 2;
    State state = 3;
  }
  oneof sensitive {
    string secret = 4 [(squareup.protos.kotlin.redacted_option.redacted) = true];
    Payload wholly_redacted = 5 [(squareup.protos.kotlin.redacted_option.redacted) = true];
    string public_text = 6;
  }
}

message Payload {
  repeated Image images = 1;
  optional string label = 2;
}

message Image {
  optional string light_url = 1 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  optional string dark_url = 2 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  optional string caption = 3;
}

enum State {
  READY = 0;
  DONE = 1;
}
