package squareup.protos.kotlin.redacted_map;

option java_package = "com.squareup.wire.protos.kotlin.redacted_map";

import "option_redacted.proto";

message Secret {
  optional string a = 1 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  optional string b = 2;
}

message SecretCollections {
  optional Secret one = 1;
  repeated Secret many = 2;
  map<string, Secret> by_key = 3;
  optional string name = 4;
}
