syntax = "proto2";

package squareup.protos.kotlin.flat_redacted;

option java_package = "com.squareup.wire.protos.kotlin.flatredacted";

import "option_redacted.proto";

// One message per code style. The members of the `variant` oneof are a message that holds a
// redacted field, a scalar, and a redacted scalar.
message FlatRedactedOneOfPlain {
  oneof variant {
    Payload payload = 1;
    string text = 2;
    string secret = 3 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  }
}

message FlatRedactedOneOfInterop {
  oneof variant {
    Payload payload = 1;
    string text = 2;
    string secret = 3 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  }
}

message FlatRedactedOneOfBuildersOnly {
  oneof variant {
    Payload payload = 1;
    string text = 2;
    string secret = 3 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  }
}

message FlatRedactedOneOfInteropBuildersOnly {
  oneof variant {
    Payload payload = 1;
    string text = 2;
    string secret = 3 [(squareup.protos.kotlin.redacted_option.redacted) = true];
  }
}

// A oneof with only one member keeps the same code in every style.
message FlatRedactedSingleOneOfBuildersOnly {
  oneof variant {
    Payload payload = 1;
  }
}

message Payload {
  optional string label = 1;
  optional string token = 2 [(squareup.protos.kotlin.redacted_option.redacted) = true];
}
