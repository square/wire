syntax = "proto2";

package squareup.protos.kotlin.oneof_merge_sealed_builders;

option java_package = "com.squareup.wire.protos.kotlin.oneofmergesealedbuilders";

import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

message Leaf {
  repeated int32 values = 1;
  optional string name = 2;
}

/** Members and fields named like the locals of the generated decode function. */
message SealedBuildersOnlyNames {
  optional Leaf existing = 5;
  oneof it {
    Leaf x = 1;
    Leaf reader = 2;
    string text = 3;
  }
  oneof reader {
    Leaf y = 6;
    string z = 7;
  }
}
