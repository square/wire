syntax = "proto3";

package squareup.protos.kotlin.swift_proto3_edge_cases;

// The zero constant of a proto3 enum becomes `defaultedValue`.
enum SwiftProto3TypeZero {
  Type = 0;
  OTHER = 1;
}

enum SwiftProto3SelfZero {
  self = 0;
  OTHER_SELF = 1;
}

enum SwiftProto3InitZero {
  init = 0;
  OTHER_INIT = 1;
}

enum SwiftProto3ProtocolZero {
  Protocol = 0;
  OTHER_PROTOCOL = 1;
}

enum SwiftProto3AnyZero {
  Any = 0;
  OTHER_ANY = 1;
}

// A deprecated constant makes the generator write its own `allCases` list.
enum SwiftProto3AllCasesZero {
  allCases = 0 [deprecated = true];
  OTHER_ALL_CASES = 1;
}

enum SwiftProto3SameNameZero {
  SwiftProto3SameNameZero = 0;
  OTHER_SAME_NAME = 1;
}

// The generator writes a static `defaultedValue` for a proto3 enum with a zero constant.
enum SwiftProto3DefaultedValueName {
  DEFAULTED_VALUE_ZERO = 0;
  defaultedValue = 1;
}

message SwiftProto3ReservedEnumNames {
  optional SwiftProto3TypeZero type_zero = 1;
  optional SwiftProto3SelfZero self_zero = 2;
  optional SwiftProto3InitZero init_zero = 3;
  optional SwiftProto3ProtocolZero protocol_zero = 4;
  optional SwiftProto3AnyZero any_zero = 5;
  optional SwiftProto3AllCasesZero all_cases_zero = 6;
  optional SwiftProto3SameNameZero same_name_zero = 7;
  optional SwiftProto3DefaultedValueName defaulted_value_name = 8;
}

// The first segment of the type name is also the name of a constant.
message SwiftProto3Outer {
  enum Kind {
    SwiftProto3Outer = 0;
    KIND_OK = 1;
  }

  optional Kind kind = 1;
}

message SwiftProto3FieldNames {
  string self = 1;
  string Self = 2;
  string Type = 3;
  string Protocol = 4;
  string Any = 5;
  optional string optional_protocol = 6;
  repeated string init = 7;
}

message SwiftProto3OneofNames {
  oneof self {
    string a = 1;
    int32 b = 2;
  }

  oneof Protocol {
    string c = 3;
    int32 d = 4;
  }

  oneof any {
    string e = 5;
    int32 f = 6;
  }
}
