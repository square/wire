syntax = "proto2";
package com.squareup.wire.protos.empty_packed;
import "wire/extensions.proto";
message EmptyPacked {
  enum Choice { A = 1; B = 2; }
  message Child {}
  repeated int32 numbers = 1 [packed = false];
  repeated bool flags = 2 [packed = false];
  repeated Choice choices = 3 [packed = false];
  repeated int32 packed_numbers = 4 [packed = true];
  repeated fixed32 fixed32s = 5 [packed = false];
  repeated fixed64 fixed64s = 6 [packed = false];
  repeated string strings = 7;
  repeated bytes blobs = 8;
  repeated Child children = 9;
  optional int32 after = 10;
  repeated int32 int_array = 11 [packed = true, (wire.use_array) = true];
  repeated int64 long_array = 12 [packed = true, (wire.use_array) = true];
  repeated float float_array = 13 [packed = true, (wire.use_array) = true];
  repeated double double_array = 14 [packed = true, (wire.use_array) = true];
}
