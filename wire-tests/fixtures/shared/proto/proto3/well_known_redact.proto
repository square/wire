syntax = "proto3";

package squareup.proto3;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message WellKnownRedact {
  google.protobuf.Duration duration = 1;
  google.protobuf.Timestamp timestamp = 2;
  google.protobuf.Empty empty = 3;
  google.protobuf.FieldMask mask = 4;
  google.protobuf.StringValue string_value = 5;
  google.protobuf.Int32Value int32_value = 6;

  repeated google.protobuf.Duration rep_duration = 11;
  repeated google.protobuf.Timestamp rep_timestamp = 12;
  repeated google.protobuf.FieldMask rep_mask = 13;
  repeated google.protobuf.StringValue rep_string_value = 14;

  map<int32, google.protobuf.Duration> map_int32_duration = 21;
  map<int32, google.protobuf.FieldMask> map_int32_mask = 22;
  map<int32, google.protobuf.StringValue> map_int32_string_value = 23;

  oneof choice {
    google.protobuf.Duration oneof_duration = 31;
    google.protobuf.Timestamp oneof_timestamp = 32;
    google.protobuf.Empty oneof_empty = 33;
    google.protobuf.FieldMask oneof_mask = 34;
    google.protobuf.StringValue oneof_string_value = 35;
  }
}
