syntax = "proto2";
package squareup.proto2;

import "wire/extensions.proto";

message UseArrayProto2Interop {
  repeated int32 array_int32 = 1 [packed = true, (wire.use_array) = true];
  repeated uint32 array_uint32 = 2 [packed = true, (wire.use_array) = true];
  repeated sint32 array_sint32 = 3 [packed = true, (wire.use_array) = true];
  repeated fixed32 array_fixed32 = 4 [packed = true, (wire.use_array) = true];
  repeated sfixed32 array_sfixed32 = 5 [packed = true, (wire.use_array) = true];
  repeated int64 array_int64 = 6 [packed = true, (wire.use_array) = true];
  repeated uint64 array_uint64 = 7 [packed = true, (wire.use_array) = true];
  repeated sint64 array_sint64 = 8 [packed = true, (wire.use_array) = true];
  repeated fixed64 array_fixed64 = 9 [packed = true, (wire.use_array) = true];
  repeated sfixed64 array_sfixed64 = 10 [packed = true, (wire.use_array) = true];
  repeated float array_float = 11 [packed = true, (wire.use_array) = true];
  repeated double array_double = 12 [packed = true, (wire.use_array) = true];
}
