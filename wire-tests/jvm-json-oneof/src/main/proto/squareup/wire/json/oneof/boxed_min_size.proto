syntax = "proto3";

package squareup.wire.json.oneof.boxed_min_size;

option java_package = "squareup.wire.json.oneof.boxed_min_size";

message Nested {
  string name = 1;
}

message Choice {
  oneof choice {
    string text = 1;
    int32 number = 2;
    Nested nested = 3;
  }
  string other = 4;
}
