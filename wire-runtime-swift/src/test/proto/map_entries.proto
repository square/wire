syntax = "proto2";

message MappyThings {
  map<string, MappyThing> things = 1;
  map<sint32, MappyThing> int_things = 2;
}

message MappyThing {
  optional string name = 1;
}

message MappyScalars {
  map<string, sint64> string_ints = 1;
  map<string, bool> string_bools = 2;
  map<string, double> string_doubles = 3;
  map<string, string> string_strings = 4;
  map<sint32, string> int_strings = 5;
}

message MappyEnums {
  enum ValueEnum {
    DEFAULT = 0;
    FOO = 1;
    BAR = 2;
  }

  map<string, ValueEnum> string_enums = 1;
}

message MappyRequiredThing {
  required string name = 1;
}

message MappyRequiredThings {
  map<string, MappyRequiredThing> things = 1;
}
