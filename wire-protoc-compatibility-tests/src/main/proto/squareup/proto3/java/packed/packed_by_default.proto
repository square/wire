syntax = "proto3";

package squareup.proto3.java.packed;

// proto3 packs repeated scalar numeric, bool, and enum fields by default.
message PackedByDefault {
  repeated bool rep_bool = 1;
  repeated Color rep_enum = 2;
  repeated Size rep_nested_enum = 3;
  repeated bool unpacked_bool = 4 [packed = false];
  repeated Color unpacked_enum = 5 [packed = false];

  enum Size {
    SIZE_UNSPECIFIED = 0;
    SMALL = 1;
    LARGE = 2;
  }
}

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
}
